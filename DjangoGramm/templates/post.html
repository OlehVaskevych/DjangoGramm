{% extends 'master.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% load static %}

{% block styles %}
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}

{% block token %}
    <meta name="csrf-token" content="{{ csrf_token }}">
{% endblock %}

{% block content %}
    <h2></h2>
    <div id="posts-app">
        <!-- Vue component will render here -->
    </div>

<script>
    let posts = {{ posts | safe }};
    let userIsAuthenticated = {% if user.is_authenticated %}true{% else %}false{% endif %};
    let currentUser = {% if user.is_authenticated %}{{ current_user | safe }}{% else %}null{% endif %};  // Fallback to null if not authenticated
</script>
{% endblock %}
