{% extends 'master.html' %}

{% block title %}Logout{% endblock %}

{% block content %}
    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="btn btn-secondary" type="submit">Confirm Logout</button>
        <a class="btn btn-secondary" href="{% url 'settings' %}">Cancel</a>
    </form>
{% endblock %}
