stages:
  - deploy

deploy_to_azure:
  image: alpine
  stage: deploy
  script:
    - apk add --no-cache zip curl
    - cd DjangoGramm
    - zip -r django_app.zip .
    - curl --ftp-ssl --disable-epsv -T django_app.zip -u "$AZURE_FTP_USERNAME:$AZURE_FTP_PASSWORD" "ftps://waws-prod-plc-003.ftp.azurewebsites.windows.net/site/wwwroot/django_app.zip"
  only:
    - main
